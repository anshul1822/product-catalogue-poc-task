# Runs the whole app locally:  docker compose up --build
#   App:        http://localhost:8080
#   API health: http://localhost:3000/api/health
#
# No .env file is needed: every value below has a safe default. To override one,
# copy .env.example to .env (Compose reads it automatically) and edit it.
# Slice F5 adds PostgreSQL (enquiries) and Mailpit (sales inbox).

name: product-catalogue

services:
  server:
    build: ./server
    environment:
      PORT: "3000"
      FAKESTORE_BASE_URL: ${FAKESTORE_BASE_URL:-https://fakestoreapi.com}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-5000}
      FEATURED_PRODUCT_IDS: ${FEATURED_PRODUCT_IDS:-12,11,3,18,5}
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  client:
    build: ./client
    environment:
      # nginx forwards /api to the server service on the Compose network.
      API_UPSTREAM: http://server:3000
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      server:
        # Wait for the server's HEALTHCHECK, so the first page load can reach the API.
        condition: service_healthy
    restart: unless-stopped
