# Security headers for the web app. Included in each location that serves files,
# because nginx drops inherited add_header directives in any block that sets its own.
# /api/ responses are left alone: the API sets its own headers (helmet).
#
# CSP: scripts, styles and API calls only from this origin. Images may come from
# any https host, because product image URLs come from the product source.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
